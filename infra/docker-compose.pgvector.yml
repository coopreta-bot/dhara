services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: ${DHARA_POSTGRES_DB:-dhara}
      POSTGRES_USER: ${DHARA_POSTGRES_USER:-dhara}
      POSTGRES_PASSWORD: ${DHARA_POSTGRES_PASSWORD:?Set DHARA_POSTGRES_PASSWORD in infra/.env.pgvector}
    ports:
      - "127.0.0.1:${DHARA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - dhara_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  dhara_pgvector_data:
