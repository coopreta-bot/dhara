name: pgvector integration

on:
  push:
    paths:
      - ".github/workflows/pgvector-integration.yml"
      - "pyproject.toml"
      - "rag/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/pgvector-integration.yml"
      - "pyproject.toml"
      - "rag/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie
        env:
          POSTGRES_DB: dhara
          POSTGRES_USER: dhara
          POSTGRES_PASSWORD: dhara-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dhara -d dhara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run pgvector integration test
        env:
          DHARA_DATABASE_URL: postgresql+asyncpg://dhara:dhara-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/dhara
          DHARA_RUN_PGVECTOR_INTEGRATION: "1"
        run: python -m pytest tests/integration/test_pgvector_stack.py -q
